name: Banking ETL

on:
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: banking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas sqlalchemy mysql-connector-python faker

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be fully ready..."
          for i in {1..60}; do
            mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" && break
            echo "Still waiting..."
            sleep 2
          done

      - name: Create Tables
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot banking < sql/schema.sql

      - name: Generate Data
        run: |
          python scripts/generate_data.py

      - name: Load Data to MySQL
        run: |
          python scripts/load_mysql.py

      - name: Test MySQL Connection
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES;"

      - name: Run Transformation
        run: |
          python scripts/transform.py